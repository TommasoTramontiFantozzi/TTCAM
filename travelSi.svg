<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200">
  <!-- Cornice standard -->
  <rect x="1" y="1" width="22" height="22" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" rx="2" />
  <rect x="4" y="4" width="16" height="16" fill="none" stroke="#B0BEC5" stroke-dasharray="2 2" stroke-width="1"/>
  
  <!-- Il solido 3D (Piano di lavoro con spessore come da immagine) -->
  <!-- Spessore/Bordo frontale (colore più scuro per profondità) -->
  <path d="M4,15 L12,18 L20,15 L20,16 L12,19 L4,16 Z" fill="#90A4AE" stroke="#78909C" stroke-width="0.5"/>
  <!-- Faccia superiore del piano inclinato -->
  <path d="M4,15 L12,12 L20,15 L12,18 Z" fill="#E3F2FD" stroke="#B0BEC5" stroke-width="0.75"/>

  <!-- Tracciato G-Code proiettato sulla superficie -->
  <path d="M7,15.5 L12,14 L16,15.5" fill="none" stroke="#2196F3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Linea tratteggiata di proiezione verticale (Altezza Z dell'utensile) -->
  <line x1="12" y1="14" x2="12" y2="8" stroke="#1976D2" stroke-width="0.75" stroke-dasharray="1 1"/>

  <!-- Fresa a cono sospesa (esattamente come nel rendering) -->
  <!-- Cilindro superiore (Mandrino) -->
  <rect x="11" y="4" width="2" height="2.5" fill="#1976D2"/>
  <!-- Cono inferiore (Punta utensile) -->
  <path d="M10.5,6.5 L13.5,6.5 L12,8 Z" fill="#2196F3" stroke="#1976D2" stroke-width="0.5"/>
  
  <!-- Nodi geometrici d'angolo standard -->
  <rect x="3" y="3" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="19" y="3" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="3" y="19" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="19" y="19" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
</svg>
