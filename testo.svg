<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200">
  <!-- Sfondo e bordo esterno (Identico) -->
  <rect x="1" y="1" width="22" height="22" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" rx="2" />
  
  <!-- Griglia di allineamento interna (Identica) -->
  <rect x="4" y="4" width="16" height="16" fill="none" stroke="#B0BEC5" stroke-dasharray="2 2" stroke-width="1"/>
  
  <!-- Icona Testo / Allineamento -->
  <!-- 1. Lettera "A" (Geometria Font riscalata e centrata nella griglia) -->
  <path d="M 6,16 L 9.5,6.5 L 11.5,6.5 L 15,16 L 13.2,16 L 12.3,13.2 L 8.7,13.2 L 7.8,16 Z M 9.1,11.8 L 11.9,11.8 L 10.5,7.8 Z" fill="#2196F3" stroke="#1976D2" stroke-width="0.5" stroke-linejoin="round" />
  
  <!-- 2. Linea di riferimento / Allineamento verticale (Spostata a filo griglia x=16) -->
  <line x1="16" y1="5" x2="16" y2="19" stroke="#1976D2" stroke-width="1.5" stroke-linecap="round" />

  <!-- Quadrati di controllo ai quattro angoli (Identici) -->
  <rect x="3" y="3" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="19" y="3" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="3" y="19" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="19" y="19" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
</svg>