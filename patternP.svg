<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200">
  <!-- Sfondo e bordo esterno (Identico) -->
  <rect x="1" y="1" width="22" height="22" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" rx="2" />
  
  <!-- Griglia di allineamento interna (Identica) -->
  <rect x="4" y="4" width="16" height="16" fill="none" stroke="#B0BEC5" stroke-dasharray="2 2" stroke-width="1"/>
  
  <!-- Icona Pattern Premuta: Elementi interni spostati in basso di 1px e scuriti -->
  <!-- 1. Frecce direzionali del Pattern (Spostate in basso, colore scurito a #0D47A1) -->
  <path d="M 8,17 L 16,17 M 14,15 L 16,17 L 14,19" fill="none" stroke="#0D47A1" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M 8,17 L 8,9 M 6,11 L 8,9 L 10,11" fill="none" stroke="#0D47A1" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- 2. Lavorazione ORIGINE (Spostata a cy=17, contorno #0D47A1) -->
  <circle cx="8" cy="17" r="2.5" fill="#1565C0" stroke="#0D47A1" stroke-width="1" />
  <circle cx="8" cy="17" r="0.8" fill="#FFFFFF" />
  
  <!-- 3. Lavorazioni REPLICATE (Spostate in basso, riempimento #BBDEFB, tratteggio #1565C0) -->
  <!-- Replica asse X -->
  <circle cx="16" cy="17" r="2" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="2 1" />
  <!-- Replica asse Y -->
  <circle cx="8" cy="9" r="2" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="2 1" />
  <!-- Replica Diagonale (Matrice) -->
  <circle cx="16" cy="9" r="2" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="2 1" />

  <!-- Quadrati di controllo spostati all'interno (coordinate 4 e 18) per simulare lo schiacciamento -->
  <rect x="4" y="4" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="18" y="4" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="4" y="18" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="18" y="18" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
</svg>