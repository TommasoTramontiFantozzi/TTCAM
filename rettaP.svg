<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200">
  <!-- Sfondo e bordo esterno (Identico) -->
  <rect x="1" y="1" width="22" height="22" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" rx="2" />
  
  <!-- Griglia di allineamento interna (Identica) -->
  <rect x="4" y="4" width="16" height="16" fill="none" stroke="#B0BEC5" stroke-dasharray="2 2" stroke-width="1"/>
  
  <!-- Icona Linea / Segmento Premuta: Elementi spostati in basso di 1px e scuriti -->
  <!-- 1. Elemento geometrico principale (Colore scurito a #0D47A1) -->
  <line x1="6.5" y1="18.5" x2="17.5" y2="7.5" stroke="#0D47A1" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- 2. Nodi geometrici estremita ridimensionati -->
  <!-- Nodo iniziale (Spostato a cy=18.5, riempimento #1565C0 e contorno #0D47A1) -->
  <circle cx="6.5" cy="18.5" r="1.8" fill="#1565C0" stroke="#0D47A1" stroke-width="1" />
  <circle cx="6.5" cy="18.5" r="0.5" fill="#FFFFFF" />
  
  <!-- Nodo finale (Spostato a cy=7.5, riempimento #1565C0 e contorno #0D47A1) -->
  <circle cx="17.5" cy="7.5" r="1.8" fill="#1565C0" stroke="#0D47A1" stroke-width="1" />
  <circle cx="17.5" cy="7.5" r="0.5" fill="#FFFFFF" />

  <!-- Quadrati di controllo spostati all'interno (coordinate 4 e 18) per l'effetto di compressione -->
  <rect x="4" y="4" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="18" y="4" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="4" y="18" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="18" y="18" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
</svg>