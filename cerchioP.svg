<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200">
  <!-- Sfondo generale del canvas -->
  <rect x="1" y="1" width="22" height="22" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" rx="2" />
  
  <!-- Linea tratteggiata di focus originale -->
  <rect x="4" y="4" width="16" height="16" fill="none" stroke="#B0BEC5" stroke-dasharray="2 2" stroke-width="1"/>
  
  <!-- Pulsante circolare premuto: raggio ridotto a 6 (da 7) e colore piu scuro (#BBDEFB) -->
  <circle cx="12" cy="12" r="6" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  
  <!-- Quadratini di controllo spostati verso l'interno (coordinata 5 e 17) -->
  <rect x="5" y="5" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="17" y="5" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="5" y="17" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="17" y="17" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
</svg>