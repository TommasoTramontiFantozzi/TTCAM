<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200">
  <!-- Sfondo e bordo esterno (Identico) -->
  <rect x="1" y="1" width="22" height="22" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" rx="2" />
  
  <!-- Griglia di allineamento interna (Identica) -->
  <rect x="4" y="4" width="16" height="16" fill="none" stroke="#B0BEC5" stroke-dasharray="2 2" stroke-width="1"/>
  
  <!-- Icona Lamatura Premuta: Sagoma leggermente rimpicciolita (scalata verso il centro di 1px) e colore piu scuro -->
  <!-- 1. Riempimento azzurro scuro della sagoma (#BBDEFB) -->
  <path d="M 6,7 L 18,7 L 18,11 L 14,11 L 14,17 L 10,17 L 10,11 L 6,11 Z" fill="#BBDEFB" />
  
  <!-- 2. Profilo esterno della lamatura premuta (colore piu scuro #1565C0) -->
  <path d="M 6,7 L 18,7 L 18,11 L 14,11 L 14,17 L 10,17 L 10,11 L 6,11 Z" fill="none" stroke="#1565C0" stroke-width="2" stroke-linejoin="round" />
  
  <!-- 3. Linea d'asse verticale di simmetria (Identica) -->
  <line x1="12" y1="3" x2="12" y2="21" stroke="#1976D2" stroke-width="1.2" stroke-dasharray="4 2 1 2" />
  
  <!-- Quadrati di controllo spostati verso l'interno di 1px (coordinate 4 e 18) per seguire lo schiacciamento -->
  <rect x="4" y="4" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="18" y="4" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="4" y="18" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <rect x="18" y="18" width="2" height="2" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
</svg>